name: agrosetu_app
description: "AgroSetu Farmer App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  shared_preferences: ^2.2.2
  google_fonts: ^6.1.0
  iconsax: ^0.0.8
  intl: ^0.19.0
  geolocator: ^10.0.0
